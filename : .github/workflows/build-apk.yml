name: Construire l'APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restaurer la clé de signature
        run: |
          base64 -d app/compteur.keystore.b64 > app/compteur.keystore
          echo "9677614ba429069e291dbc4816adc2ad94b8ff3d22c9da4c4d5fd88d23809d3e  app/compteur.keystore" | sha256sum -c

      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk CompteurDePoint.apk

      - name: APK téléchargeable (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: CompteurDePoint-apk
          path: CompteurDePoint.apk

      - name: Publier une Release (quand on pousse un tag v1.0.0, v1.1.0…)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CompteurDePoint.apk
