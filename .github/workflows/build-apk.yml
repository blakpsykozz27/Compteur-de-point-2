name: Construire l'APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

  

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restaurer la clé de signature
        run: |
          base64 -d app/compteur.keystore.b64 > app/compteur.keystore
          echo "9677614ba429069e291dbc4816adc2ad94b8ff3d22c9da4c4d5fd88d23809d3e  app/compteur.keystore" | sha256sum -c

      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk CompteurDePoint.apk

      - name: APK téléchargeable (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: CompteurDePoint-apk
          path: CompteurDePoint.apk

      - name: Lire la version
        id: ver
        run: echo "version=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)" >> "$GITHUB_OUTPUT"

      # Chaque version (versionName) devient automatiquement une Release :
      # l'appli la détecte au lancement et propose la mise à jour.
      - name: Publier la Release de la version
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Compteur de Points ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: CompteurDePoint.apk
